schema: spec-driven

context: |
  Proyecto: Cuentas Claras — app para dividir gastos entre participantes de un viaje.
  Monorepo: backend/ (Spring Boot 4.1.1, Java 21, Maven, PostgreSQL 17) y frontend/ (React + Vite, fase 2).
  Fase actual: solo backend. No tocar frontend/.
  Paquete base: com.cuentasclaras.backend
  PKs: BIGINT autoincremental (BIGSERIAL en PostgreSQL, IDENTITY en JPA).
  ORM: Hibernate con ddl-auto=update (sin Flyway ni Liquibase).
  Seguridad: Spring Security + JWT (jjwt 0.12.6). Endpoints públicos: /api/auth/**
  Ver CLAUDE.md para modelo de datos completo, convenciones y fuera de alcance.

rules:
  proposal:
    - Describe solo lo que cambia en esta tarea, no el proyecto completo
    - Incluir siempre una sección Non-Goals con lo que NO hace esta tarea
  spec:
    - Usar formato Dado/Cuando/Entonces para cada escenario
    - Incluir casos borde explícitos
  design:
    - Incluir decisiones técnicas con alternativas descartadas
    - Referenciar el modelo de datos de CLAUDE.md
  tasks:
    - Una tarea = un archivo o una clase Java
    - Incluir verificación de compilación en cada tarea

operations:
  apply:
    guidance:
      - Leer CLAUDE.md antes de generar cualquier código
      - PKs siempre BIGINT con IDENTITY, nunca UUID
      - Respetar la estructura de paquetes definida en CLAUDE.md
      - No crear archivos en frontend/
  archive:
    guidance:
      - Verificar que todos los checkboxes estén marcados antes de archivar