server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router corre en modo declarativo, sin servidor: /grupos/3/gastos/7 no es
    # un archivo. Sin esta regla, recargar cualquier ruta que no sea la raíz da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre, así que se pueden cachear indefinidamente.
    # index.html no: es el que apunta al hash nuevo después de cada despliegue.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# A propósito NO hay proxy_pass hacia el backend: dónde vive el backend depende de
# la topología del despliegue, y fijarlo acá ataría la imagen a una suposición. Para
# el caso de dominios distintos está `cors.allowed-origins` en el backend.
