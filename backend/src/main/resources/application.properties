spring.application.name=backend

# Servidor
server.port=8080

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cuentas_claras}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT
jwt.secret=${JWT_SECRET:clave-secreta-local-solo-para-desarrollo-no-usar-en-prod}
jwt.expiration=86400000

# CriptoYa (conversión de moneda a USDT). Los timeouts del cliente están en RestClientConfig.
criptoya.base-url=${CRIPTOYA_BASE_URL:https://criptoya.com/api/binancep2p}

# Manejo de errores: una ruta inexistente debe llegar al GlobalExceptionHandler
# (404 con el formato estándar) en vez de resolverse como recurso estático o con
# la página de error por defecto de Spring Boot. El backend no sirve estáticos.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Caché de cotizaciones de CriptoYa.
# cache-ttl: mientras la cotización es más nueva que esto, no se consulta de nuevo.
# cache-max-stale: si CriptoYa falla, se acepta usar una cotización de hasta esta
# antigüedad en vez de responder 503. Sin ninguna cotización previa del par, 503.
criptoya.cache-ttl=60s
criptoya.cache-max-stale=24h

# CORS: vacío en desarrollo (el proxy de Vite evita la petición cruzada). En
# producción, la lista de orígenes del frontend separados por coma.
cors.allowed-origins=
