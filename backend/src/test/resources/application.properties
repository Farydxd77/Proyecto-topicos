# Configuración de la FASE DE TEST.
#
# El archivo se llama igual que el de src/main/resources a propósito: el classpath
# de test va antes que el de main, así que durante los tests este reemplaza por
# completo al otro. La consecuencia buscada es que NINGUNA clase de test necesita
# anotarse con @ActiveProfiles ni con @TestPropertySource para usar la base en
# memoria: un test nuevo lo hereda sin hacer nada, y no hay forma de olvidarse una
# anotación y terminar escribiendo en la base de desarrollo.
#
# Los @TestPropertySource que ya tienen las clases de test siguen funcionando: se
# aplican encima de esto, con mayor precedencia.

spring.application.name=backend

# Base de datos: H2 en memoria, en modo de compatibilidad PostgreSQL.
# DB_CLOSE_DELAY=-1 la mantiene viva mientras la JVM lo esté, para que los distintos
# contextos de Spring que cachea el runner de tests compartan la misma base.
spring.datasource.url=jdbc:h2:mem:cuentas_claras_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate. El dialecto TIENE que ser el de H2: dejar el de PostgreSQL genera
# SQL que H2 no entiende.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT. Las clases que necesitan un secreto propio lo pisan con @TestPropertySource.
jwt.secret=clave-secreta-de-test-1234567890-1234567890-abcdef
jwt.expiration=86400000

# CriptoYa. Los tests que convierten monedas simulan el cliente HTTP; esta URL no se
# consulta de verdad, pero la propiedad tiene que existir para que el bean arranque.
criptoya.base-url=http://localhost:0/criptoya-no-usado-en-tests
criptoya.cache-ttl=60s
criptoya.cache-max-stale=24h

# CORS: en tests no hay peticiones cruzadas.
cors.allowed-origins=

# Manejo de errores: mismo comportamiento que en producción, para que los tests de
# la capacidad manejo-errores verifiquen lo que realmente se despliega.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
